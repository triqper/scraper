<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netlify Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f6f8fa;
      --surface: #ffffff;
      --border:  #d0d7de;
      --text:    #1f2328;
      --muted:   #656d76;
      --accent:  #0969da;
      --green:   #1a7f37;
      --radius:  6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      background: #24292f;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 { color: #fff; font-size: 1rem; font-weight: 600; }
    header .updated { color: #8b949e; font-size: 0.8rem; margin-left: auto; }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* ── Site card ─────────────────────────────────────── */
    .site-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .site-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #f6f8fa;
    }
    .site-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
    }
    .site-header a {
      color: var(--muted);
      font-size: 0.8rem;
      text-decoration: none;
      margin-left: auto;
    }
    .site-header a:hover { color: var(--accent); }

    /* ── Summary row ──────────────────────────────────── */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border-bottom: 1px solid var(--border);
    }
    .stat-box {
      padding: 1rem 1.25rem;
      border-right: 1px solid var(--border);
    }
    .stat-box:last-child { border-right: none; }
    .stat-label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--text); }

    /* ── Charts row ───────────────────────────────────── */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
    }
    .chart-box {
      padding: 1rem 1.25rem;
      border-right: 1px solid var(--border);
    }
    .chart-box:last-child { border-right: none; }
    .chart-title { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
    .chart-box canvas { width: 100% !important; height: 120px !important; }

    /* ── Tables row ───────────────────────────────────── */
    .tables-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .table-box {
      padding: 1rem 1.25rem;
      border-right: 1px solid var(--border);
    }
    .table-box:last-child { border-right: none; }
    .table-title { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    thead th {
      text-align: left;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.25rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    thead th:last-child { text-align: right; }
    tbody td {
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid #f0f0f0;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tbody td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:last-child td { border-bottom: none; }

    /* progress bar in table */
    .bar-cell { position: relative; }
    .bar-bg {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: #dbeafe;
      border-radius: 2px;
      z-index: 0;
    }
    .bar-text { position: relative; z-index: 1; }

    /* ── Empty / loading state ────────────────────────── */
    .empty { color: var(--muted); font-style: italic; padding: 0.5rem 0; font-size: 0.85rem; }

    @media (max-width: 640px) {
      .summary-row, .charts-row, .tables-row { grid-template-columns: 1fr; }
      .stat-box, .chart-box, .table-box { border-right: none; border-bottom: 1px solid var(--border); }
      .tables-row .table-box:last-child { border-bottom: none; }
    }
  </style>
</head>
<body>

<header>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
  </svg>
  <h1>Netlify Analytics</h1>
  <span class="updated" id="updated-at"></span>
</header>

<main id="main">
  <p style="color:var(--muted)">Laden…</p>
</main>

<script>
const SITE_ORDER = [
  "woonstroom-aanbod-landing",
  "woonstroom-woningwaarde-landing",
  "woonstroom-interesse-landing",
  "woonstroom-aanbod",
  "woonstroom-woningwaarde",
  "woonstroom-interesse",
];

const CHART_COLORS = {
  pageviews: { line: "#0969da", fill: "rgba(9,105,218,0.12)" },
  visitors:  { line: "#1a7f37", fill: "rgba(26,127,55,0.12)" },
};

function fmt(n) {
  return (n ?? 0).toLocaleString("nl-NL");
}

function makeChart(canvas, labels, values, color) {
  new Chart(canvas, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: color.line,
        backgroundColor: color.fill,
        borderWidth: 2,
        pointRadius: 3,
        pointHoverRadius: 4,
        fill: true,
        tension: 0.3,
      }],
    },
    options: {
      responsive: false,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { mode: "index", intersect: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 0, maxTicksLimit: 7 } },
        y: { beginAtZero: true, grid: { color: "#f0f0f0" }, ticks: { font: { size: 10 }, precision: 0 } },
      },
    },
  });
}

function barTable(rows, colA, colB, valueKey) {
  if (!rows || rows.length === 0) return `<p class="empty">Geen data</p>`;
  const max = Math.max(...rows.map(r => r[valueKey] ?? 0), 1);
  let html = `<table>
    <thead><tr><th>${colA}</th><th>${colB}</th></tr></thead>
    <tbody>`;
  for (const row of rows) {
    const val = row[valueKey] ?? 0;
    const pct = Math.round((val / max) * 100);
    const label = Object.values(row).find((v, i) => i === 0) ?? "";
    html += `<tr>
      <td class="bar-cell">
        <div class="bar-bg" style="width:${pct}%"></div>
        <span class="bar-text">${escHtml(String(label))}</span>
      </td>
      <td>${fmt(val)}</td>
    </tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function shortDate(iso) {
  // "2026-05-04" → "4 mei"
  const d = new Date(iso + "T00:00:00Z");
  return d.toLocaleDateString("nl-NL", { day: "numeric", month: "short", timeZone: "UTC" });
}

function renderSite(site) {
  const card = document.createElement("div");
  card.className = "site-card";

  const daily = site.daily ?? [];
  const labels = daily.map(d => shortDate(d.date));
  const pvData  = daily.map(d => d.pageviews ?? 0);
  const visData = daily.map(d => d.visitors ?? 0);

  const chartId1 = `pv-${site.id}`;
  const chartId2 = `vis-${site.id}`;

  const countryHtml = barTable(site.top_countries, "Land", "Pageviews", "pageviews");
  const sourceHtml  = barTable(site.top_sources,   "Bron", "Verwijzingen", "referrals");

  card.innerHTML = `
    <div class="site-header">
      <h2>${escHtml(site.name)}</h2>
      <a href="${escHtml(site.url)}" target="_blank" rel="noopener">${escHtml(site.url.replace(/^https?:\/\//, ""))} ↗</a>
    </div>
    <div class="summary-row">
      <div class="stat-box">
        <div class="stat-label">Pageviews (7 dagen)</div>
        <div class="stat-value">${fmt(site.total_pageviews)}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Unieke bezoekers (7 dagen)</div>
        <div class="stat-value">${fmt(site.total_visitors)}</div>
      </div>
    </div>
    <div class="charts-row">
      <div class="chart-box">
        <div class="chart-title">Pageviews per dag</div>
        <canvas id="${chartId1}" height="120"></canvas>
      </div>
      <div class="chart-box">
        <div class="chart-title">Unieke bezoekers per dag</div>
        <canvas id="${chartId2}" height="120"></canvas>
      </div>
    </div>
    <div class="tables-row">
      <div class="table-box">
        <div class="table-title">Top landen</div>
        ${countryHtml}
      </div>
      <div class="table-box">
        <div class="table-title">Top bronnen</div>
        ${sourceHtml}
      </div>
    </div>
  `;

  // Charts must be created after the canvas elements are in the DOM
  requestAnimationFrame(() => {
    const c1 = card.querySelector(`#${chartId1}`);
    const c2 = card.querySelector(`#${chartId2}`);
    if (c1 && labels.length) makeChart(c1, labels, pvData,  CHART_COLORS.pageviews);
    if (c2 && labels.length) makeChart(c2, labels, visData, CHART_COLORS.visitors);
  });

  return card;
}

async function load() {
  const bust = Date.now();
  const [pvRes] = await Promise.all([
    fetch(`./data/analytics.json?v=${bust}`, { cache: "no-store" }),
  ]);

  const main = document.getElementById("main");
  main.innerHTML = "";

  if (!pvRes.ok) {
    main.innerHTML = `<p style="color:red">Kon analytics.json niet laden (${pvRes.status}). Controleer of de scraper al gedraaid heeft.</p>`;
    return;
  }

  const data = await pvRes.json();

  const updEl = document.getElementById("updated-at");
  if (data.last_updated) {
    const d = new Date(data.last_updated);
    updEl.textContent = `Bijgewerkt: ${d.toLocaleString("nl-NL", { dateStyle: "short", timeStyle: "short" })}`;
  }

  const sites = (data.sites ?? []).sort((a, b) => {
    const ai = SITE_ORDER.indexOf(a.name);
    const bi = SITE_ORDER.indexOf(b.name);
    if (ai === -1 && bi === -1) return a.name.localeCompare(b.name);
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });

  if (sites.length === 0) {
    main.innerHTML = `<p style="color:var(--muted)">Nog geen data. Start de scraper om data te verzamelen.</p>`;
    return;
  }

  for (const site of sites) {
    main.appendChild(renderSite(site));
  }
}

load().catch(err => {
  document.getElementById("main").innerHTML = `<p style="color:red">Fout: ${err.message}</p>`;
});
</script>
</body>
</html>
