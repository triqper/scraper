<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netlify Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f6f8fa;
      --surface: #ffffff;
      --border:  #d0d7de;
      --text:    #1f2328;
      --muted:   #656d76;
      --accent:  #0969da;
      --radius:  6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      background: #24292f;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    header h1 { color: #fff; font-size: 1rem; font-weight: 600; }
    .header-meta { color: #8b949e; font-size: 0.78rem; margin-left: auto; display: flex; gap: 1.25rem; flex-wrap: wrap; }

    /* ── Controls bar ────────────────────────────── */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .ctrl-label {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }
    input[type="datetime-local"] {
      font-size: 0.8rem;
      padding: 0.28rem 0.45rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    input[type="datetime-local"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    .ctrl-sep { color: var(--border); padding: 0 0.1rem; }

    .btn-reset {
      font-size: 0.78rem;
      padding: 0.28rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }
    .btn-reset:hover { background: var(--bg); color: var(--text); }

    .btn-nl-toggle {
      font-size: 0.78rem;
      padding: 0.28rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
    }
    .btn-nl-toggle:hover  { background: var(--bg); color: var(--text); }
    .btn-nl-toggle.active { background: #1a7f37; color: #fff; border-color: #1a7f37; }

    .mode-group {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-left: auto;
    }
    .mode-btn {
      font-size: 0.78rem;
      padding: 0.28rem 0.7rem;
      border: none;
      border-right: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .mode-btn:last-child { border-right: none; }
    .mode-btn:hover { background: var(--bg); }
    .mode-btn.active { background: var(--accent); color: #fff; }

    /* ── Main layout ─────────────────────────────── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    /* ── Site card ───────────────────────────────── */
    .site-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .site-header {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      background: #f6f8fa;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .site-header h2 { font-size: 0.88rem; font-weight: 600; }
    .site-header a { color: var(--muted); font-size: 0.76rem; text-decoration: none; margin-left: auto; }
    .site-header a:hover { color: var(--accent); }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border-bottom: 1px solid var(--border);
    }
    .stat-box {
      padding: 0.8rem 1.25rem;
      border-right: 1px solid var(--border);
    }
    .stat-box:last-child { border-right: none; }
    .stat-label { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.15rem; }
    .stat-value { font-size: 1.55rem; font-weight: 700; }

    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
    }
    .chart-box {
      padding: 0.8rem 1.25rem;
      border-right: 1px solid var(--border);
      min-width: 0;
    }
    .chart-box:last-child { border-right: none; }
    .chart-title { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .chart-wrap { position: relative; height: 120px; }
    .chart-wrap canvas { width: 100% !important; height: 100% !important; }
    .chart-note { color: var(--muted); font-size: 0.78rem; font-style: italic; padding-top: 0.5rem; }

    .tables-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .table-box {
      padding: 0.8rem 1.25rem;
      border-right: 1px solid var(--border);
      min-width: 0;
    }
    .table-box:last-child { border-right: none; }
    .table-title { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; table-layout: fixed; }
    thead th { text-align: left; color: var(--muted); font-size: 0.7rem; font-weight: 500; padding: 0.18rem 0.4rem; border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    thead th:last-child { text-align: right; width: 4.5rem; }
    tbody td { padding: 0.32rem 0.4rem; border-bottom: 1px solid #f0f0f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tbody td:last-child { text-align: right; font-variant-numeric: tabular-nums; width: 4.5rem; }
    tbody tr:last-child td { border-bottom: none; }
    .bar-cell { position: relative; }
    .bar-bg { position: absolute; left: 0; top: 2px; bottom: 2px; background: #dbeafe; border-radius: 2px; z-index: 0; }
    .bar-text { position: relative; z-index: 1; }
    .empty { color: var(--muted); font-style: italic; font-size: 0.8rem; }

    /* ── Landen over tijd ────────────────────────── */
    .country-chart-section {
      border-top: 1px solid var(--border);
      padding: 0.8rem 1.25rem;
    }
    .chart-wrap--country { height: 160px; }

    /* ── Forms section ───────────────────────────── */
    .forms-section {
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 180px 1fr;
    }
    .form-stat {
      padding: 0.8rem 1.25rem;
      border-right: 1px solid var(--border);
    }
    .form-stat .stat-value { font-size: 1.3rem; }
    .form-stat .sub-label { color: var(--muted); font-size: 0.7rem; margin-top: 0.1rem; }
    .form-chart-box { padding: 0.8rem 1.25rem; min-width: 0; }

    /* ── Compare section ─────────────────────────── */
    #compare {
      max-width: 1100px;
      margin: 1.25rem auto 0;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .compare-group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .compare-group-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0.45rem 0.75rem;
      background: #f6f8fa;
      border-bottom: 1px solid var(--border);
    }
    .mini-card {
      padding: 0.5rem 0.75rem 0.6rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .mini-card:last-child { border-bottom: none; }
    .mini-card:hover { background: #eef2ff; }
    .mini-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.3rem;
    }
    .mini-card-name { font-size: 0.72rem; color: var(--text); font-weight: 500; }
    .mini-card-total { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .mini-chart-wrap { height: 50px; position: relative; }
    .mini-chart-wrap canvas { width: 100% !important; height: 100% !important; }

    /* ── Group layout ────────────────────────────── */
    .group-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    /* ── Group header between full cards ─────────── */
    .group-header {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      padding: 0.25rem 0 0.1rem;
      border-bottom: 2px solid var(--border);
      margin-bottom: -0.5rem;
    }

    @media (max-width: 600px) {
      .summary-row, .charts-row, .tables-row { grid-template-columns: 1fr; }
      .stat-box, .chart-box, .table-box { border-right: none; border-bottom: 1px solid var(--border); }
      .mode-group { margin-left: 0; }
      .forms-section { grid-template-columns: 1fr; }
      .form-stat { border-right: none; border-bottom: 1px solid var(--border); }
      #compare { grid-template-columns: 1fr; }
      .group-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
  </svg>
  <h1>Netlify Analytics</h1>
  <div class="header-meta">
    <span id="zero-point-at"></span>
    <span id="updated-at"></span>
  </div>
</header>

<div class="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">Van</span>
    <input type="datetime-local" id="from-dt" />
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Tot</span>
    <input type="datetime-local" id="to-dt" />
  </div>
  <button class="btn-reset" id="reset-filter">Alles tonen</button>
  <button class="btn-nl-toggle" id="nl-toggle">Alleen NL</button>
  <div class="mode-group">
    <button class="mode-btn active" data-mode="per-dag">Per dag</button>
    <button class="mode-btn" data-mode="totaal">Totaal</button>
    <button class="mode-btn" data-mode="per-uur">Per uur</button>
  </div>
</div>

<main id="main">
  <p style="color:var(--muted)">Laden…</p>
</main>

<script>
/* ─── State ───────────────────────────────────────────────── */
const GROUPS = [
  { title: "Interesse",    sites: ["woonstroom-interesse",    "woonstroom-interesse-landing"]    },
  { title: "Aanbod",       sites: ["woonstroom-aanbod",       "woonstroom-aanbod-landing"]       },
  { title: "Woningwaarde", sites: ["woonstroom-woningwaarde", "woonstroom-woningwaarde-landing"] },
];
const SITE_ORDER = GROUPS.flatMap(g => g.sites);

const DISPLAY_NAMES = {
  "woonstroom-aanbod":              "QR Flyer Aanbod",
  "woonstroom-interesse":           "QR Flyer Interesse",
  "woonstroom-woningwaarde":        "QR Flyer Woningwaarde",
  "woonstroom-aanbod-landing":      "Aanbod Landing",
  "woonstroom-interesse-landing":   "Interesse Landing",
  "woonstroom-woningwaarde-landing":"Woningwaarde Landing",
};
function displayName(name) { return DISPLAY_NAMES[name] ?? name; }

const COLORS = {
  pageviews: { line: "#0969da", fill: "rgba(9,105,218,0.10)", bar: "rgba(9,105,218,0.55)" },
  visitors:  { line: "#1a7f37", fill: "rgba(26,127,55,0.10)",  bar: "rgba(26,127,55,0.55)"  },
};

const COUNTRY_COLORS = [
  "rgba(9,105,218,0.7)",
  "rgba(26,127,55,0.7)",
  "rgba(207,79,8,0.7)",
  "rgba(130,50,180,0.7)",
  "rgba(191,15,52,0.7)",
];

let siteData         = [];
let formsData        = [];
let mode             = "per-dag";
let fromDt           = null;
let toDt             = null;
let nlOnly           = false;
let chartRefs        = {};   // { siteId: { pv: Chart|null, vis: Chart|null } }
let formChartRefs    = {};   // { formId: Chart|null }
let miniChartRefs    = {};
let countryChartRefs = {};   // { siteId: Chart|null }

/* ─── Helpers ─────────────────────────────────────────────── */
function fmt(n) { return (n ?? 0).toLocaleString("nl-NL"); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function shortDate(iso) {
  return new Date(iso + "T00:00:00Z")
    .toLocaleDateString("nl-NL", { day: "numeric", month: "short", timeZone: "UTC" });
}
function shortHour(isoStr) {
  return new Date(isoStr).toLocaleString("nl-NL", {
    day: "numeric", month: "short",
    hour: "2-digit", minute: "2-digit",
    timeZone: "Europe/Amsterdam",
  });
}

/* ─── Data selectors ──────────────────────────────────────── */

function inRange(dtStr) {
  // dtStr is an ISO string with timezone (hour entries) or "YYYY-MM-DD" (day entries)
  const t = new Date(dtStr.length === 10 ? dtStr + "T00:00:00Z" : dtStr);
  if (fromDt && t < fromDt) return false;
  if (toDt   && t >= toDt)  return false;
  return true;
}

function filteredHourly(site) {
  return (site.hourly ?? []).filter(r => inRange(r.hour));
}

function filteredDaily(site) {
  if (!fromDt && !toDt) return site.daily ?? [];
  // Derive date strings from the datetime boundaries
  const fromDate = fromDt ? fromDt.toISOString().slice(0, 10) : null;
  // For "to", include the day if toDt is after midnight of that day
  const toDate   = toDt   ? new Date(toDt.getTime() - 1).toISOString().slice(0, 10) : null;
  return (site.daily ?? []).filter(r =>
    (!fromDate || r.date >= fromDate) &&
    (!toDate   || r.date <= toDate)
  );
}

// Aggregate country_hourly / source_hourly within the selected range
function aggregateHourlyDeltas(rows) {
  const agg = {};
  for (const row of rows) {
    if (!inRange(row.hour)) continue;
    for (const [k, v] of Object.entries(row.deltas ?? {})) {
      agg[k] = (agg[k] ?? 0) + v;
    }
  }
  return agg;
}

function getCountries(site) {
  const agg = (!fromDt && !toDt && !nlOnly)
    ? Object.fromEntries((site.top_countries ?? []).map(r => [r.country, r.pageviews]))
    : aggregateHourlyDeltas(site.country_hourly ?? []);
  const entries = nlOnly
    ? Object.entries(agg).filter(([c]) => isNL(c))
    : Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 10);
  return entries.map(([country, pageviews]) => ({ country, pageviews }));
}

function getSources(site) {
  if (!fromDt && !toDt) {
    return site.top_sources ?? [];
  }
  const agg = aggregateHourlyDeltas(site.source_hourly ?? []);
  return Object.entries(agg)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10)
    .map(([source, referrals]) => ({ source, referrals }));
}

function getCountryChartData(site) {
  const hourly = (site.country_hourly ?? []).filter(r => inRange(r.hour));
  if (hourly.length === 0) return null;

  // Top landen op basis van totaal in gefilterde periode (alleen NL als nlOnly)
  const totals = {};
  for (const row of hourly) {
    for (const [c, v] of Object.entries(row.deltas ?? {})) {
      if (nlOnly && !isNL(c)) continue;
      totals[c] = (totals[c] ?? 0) + v;
    }
  }
  const topCountries = Object.entries(totals)
    .sort((a, b) => b[1] - a[1]).slice(0, 5).map(([c]) => c);
  if (topCountries.length === 0) return null;

  // Per tijdseenheid aggregeren
  const buckets = {};
  for (const row of hourly) {
    const key = mode === "per-uur" ? row.hour : row.hour.slice(0, 10);
    if (!buckets[key]) buckets[key] = {};
    for (const [c, v] of Object.entries(row.deltas ?? {})) {
      buckets[key][c] = (buckets[key][c] ?? 0) + v;
    }
  }

  let allKeys;
  if (mode === "per-uur") {
    const fromMs = fromDt ? fromDt.getTime() : new Date(hourly[0].hour).getTime();
    const toMs   = toDt   ? toDt.getTime()   : Date.now();
    allKeys = generateHourlyRange(fromMs, toMs);
  } else {
    const fromDate = fromDt ? fromDt.toISOString().slice(0, 10) : hourly[0].hour.slice(0, 10);
    const toDate   = toDt   ? new Date(toDt.getTime() - 1).toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10);
    allKeys = generateDailyRange(fromDate, toDate);
  }

  return {
    labels: allKeys.map(k => mode === "per-uur" ? shortHour(k) : shortDate(k)),
    datasets: topCountries.map((country, i) => ({
      label: country,
      data:  allKeys.map(k => (buckets[k] ?? {})[country] ?? 0),
      backgroundColor: COUNTRY_COLORS[i % COUNTRY_COLORS.length],
    })),
  };
}

function makeStackedChart(canvas, labels, datasets) {
  return new Chart(canvas, {
    type: "bar",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: "bottom", labels: { font: { size: 10 }, padding: 8, boxWidth: 12 } },
        tooltip: { mode: "index", intersect: false },
      },
      scales: {
        x: {
          stacked: true,
          ticks: { font: { size: 10 }, maxRotation: 0, maxTicksLimit: mode === "per-uur" ? 6 : 7 },
          grid: { display: false },
        },
        y: {
          stacked: true,
          beginAtZero: true,
          ticks: { font: { size: 10 }, precision: 0 },
          grid: { color: "rgba(0,0,0,0.05)" },
        },
      },
    },
  });
}

function getChartData(site) {
  if (nlOnly) {
    // Gebruik country_hourly NL-deltas direct als databron (run-tijdstip ≈ view-tijdstip)
    const fromMs   = fromDt ? fromDt.getTime() : Date.now();
    const toMs     = toDt   ? toDt.getTime()   : Date.now();
    const fromDate = fromDt ? fromDt.toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10);
    const toDate   = toDt   ? new Date(toDt.getTime() - 1).toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10);

    if (mode === "per-uur") {
      const nlHour   = nlPerHour(site);
      const allHours = generateHourlyRange(fromMs, toMs);
      const pvData   = allHours.map(h => nlHour[h] ?? 0);
      return { type: "bar", labels: allHours.map(h => shortHour(h)), pvData, visData: pvData };
    }
    const nlDay    = nlPerDay(site);
    const allDates = generateDailyRange(fromDate, toDate);
    if (mode === "totaal") {
      let s = 0;
      const pvData = allDates.map(d => { s += nlDay[d] ?? 0; return s; });
      return { type: "line", labels: allDates.map(d => shortDate(d)), pvData, visData: pvData };
    }
    const pvData = allDates.map(d => nlDay[d] ?? 0);
    return { type: "bar", labels: allDates.map(d => shortDate(d)), pvData, visData: pvData };
  }

  if (mode === "per-uur") {
    const rows   = filteredHourly(site);
    const lookup = Object.fromEntries(rows.map(r => [r.hour, r]));
    const fromMs = fromDt ? fromDt.getTime() : (rows.length ? new Date(rows[0].hour).getTime() : Date.now());
    const toMs   = toDt   ? toDt.getTime()   : Date.now();
    const allHours = generateHourlyRange(fromMs, toMs);
    return {
      type:    "bar",
      labels:  allHours.map(h => shortHour(h)),
      pvData:  allHours.map(h => (lookup[h] ?? {pageviews: 0}).pageviews),
      visData: allHours.map(h => (lookup[h] ?? {visitors:  0}).visitors),
    };
  }

  const rows   = filteredDaily(site);
  const lookup = Object.fromEntries(rows.map(r => [r.date, r]));
  const fromDate = fromDt ? fromDt.toISOString().slice(0, 10)
                          : (rows.length ? rows[0].date : new Date().toISOString().slice(0, 10));
  const toDate   = toDt   ? new Date(toDt.getTime() - 1).toISOString().slice(0, 10)
                          : new Date().toISOString().slice(0, 10);
  const allDates = generateDailyRange(fromDate, toDate);

  if (mode === "totaal") {
    let pvSum = 0, visSum = 0;
    return {
      type:    "line",
      labels:  allDates.map(d => shortDate(d)),
      pvData:  allDates.map(d => { pvSum  += (lookup[d]?.pageviews ?? 0); return pvSum;  }),
      visData: allDates.map(d => { visSum += (lookup[d]?.visitors  ?? 0); return visSum; }),
    };
  }

  return {
    type:    "bar",
    labels:  allDates.map(d => shortDate(d)),
    pvData:  allDates.map(d => (lookup[d]?.pageviews ?? 0)),
    visData: allDates.map(d => (lookup[d]?.visitors  ?? 0)),
  };
}

function filteredFormDaily(form) {
  const fromDate = fromDt ? fromDt.toISOString().slice(0, 10) : null;
  const toDate   = toDt   ? new Date(toDt.getTime() - 1).toISOString().slice(0, 10) : null;
  return (form.daily ?? []).filter(d =>
    (!fromDate || d.date >= fromDate) &&
    (!toDate   || d.date <= toDate)
  );
}

function filteredFormHourly(form) {
  return (form.hourly ?? []).filter(r => inRange(r.hour));
}

function filteredFormTotal(form) {
  if (mode === "per-uur") return filteredFormHourly(form).reduce((s, r) => s + r.count, 0);
  return filteredFormDaily(form).reduce((s, d) => s + d.count, 0);
}

function getFormChartData(form) {
  if (mode === "per-uur") {
    const rows   = filteredFormHourly(form);
    const lookup = Object.fromEntries(rows.map(r => [r.hour, r.count]));
    const fromMs = fromDt ? fromDt.getTime() : (rows.length ? new Date(rows[0].hour).getTime() : Date.now());
    const toMs   = toDt   ? toDt.getTime()   : Date.now();
    const allHours = generateHourlyRange(fromMs, toMs);
    return { labels: allHours.map(h => shortHour(h)), values: allHours.map(h => lookup[h] ?? 0) };
  }
  const rows     = filteredFormDaily(form);
  const lookup   = Object.fromEntries(rows.map(r => [r.date, r.count]));
  const fromDate = fromDt ? fromDt.toISOString().slice(0, 10) : (rows.length ? rows[0].date : new Date().toISOString().slice(0, 10));
  const toDate   = toDt   ? new Date(toDt.getTime() - 1).toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10);
  const allDates = generateDailyRange(fromDate, toDate);
  return { labels: allDates.map(d => shortDate(d)), values: allDates.map(d => lookup[d] ?? 0) };
}

/* ─── NL-only helpers ─────────────────────────────────────── */
function isNL(country) {
  const c = (country ?? "").toLowerCase();
  return c === "nl" || c === "netherlands" || c === "nederland";
}

function viewHourKey(runHour) {
  // Scraper detecteert pageviews ~1 uur na de echte view; verschuif terug
  const t = new Date(new Date(runHour).getTime() - 3600000);
  const y  = t.getUTCFullYear();
  const mo = String(t.getUTCMonth() + 1).padStart(2, "0");
  const d  = String(t.getUTCDate()).padStart(2, "0");
  const h  = String(t.getUTCHours()).padStart(2, "0");
  return `${y}-${mo}-${d}T${h}:00:00+00:00`;
}

function nlPerHour(site) {
  const result = {};
  for (const row of (site.country_hourly ?? [])) {
    if (!inRange(row.hour)) continue;
    const key = viewHourKey(row.hour);
    for (const [c, v] of Object.entries(row.deltas ?? {})) {
      if (isNL(c)) result[key] = (result[key] ?? 0) + v;
    }
  }
  return result;
}

function nlPerDay(site) {
  const result = {};
  for (const row of (site.country_hourly ?? [])) {
    if (!inRange(row.hour)) continue;
    const day = viewHourKey(row.hour).slice(0, 10);
    for (const [c, v] of Object.entries(row.deltas ?? {})) {
      if (isNL(c)) result[day] = (result[day] ?? 0) + v;
    }
  }
  return result;
}

function getTotals(site) {
  if (nlOnly) {
    const pv = Object.values(
      mode === "per-uur" ? nlPerHour(site) : nlPerDay(site)
    ).reduce((s, v) => s + v, 0);
    return { pv, vis: pv }; // bezoekers per land niet beschikbaar; NL pageviews als benadering
  }
  if (mode === "per-uur") {
    const rows = filteredHourly(site);
    return {
      pv:  rows.reduce((s, r) => s + r.pageviews, 0),
      vis: rows.reduce((s, r) => s + r.visitors,  0),
    };
  }
  const rows = filteredDaily(site);
  return {
    pv:  rows.reduce((s, r) => s + r.pageviews, 0),
    vis: rows.reduce((s, r) => s + r.visitors,  0),
  };
}

/* ─── Range generators (vult ontbrekende dagen/uren op met 0) ── */
function generateDailyRange(fromDate, toDate) {
  const dates = [];
  const cur = new Date(fromDate + "T00:00:00Z");
  const end = new Date(toDate  + "T00:00:00Z");
  while (cur <= end) {
    const y  = cur.getUTCFullYear();
    const mo = String(cur.getUTCMonth() + 1).padStart(2, "0");
    const d  = String(cur.getUTCDate()).padStart(2, "0");
    dates.push(`${y}-${mo}-${d}`);
    cur.setUTCDate(cur.getUTCDate() + 1);
  }
  return dates;
}

function generateHourlyRange(fromMs, toMs) {
  const hours = [];
  const cur = new Date(fromMs);
  cur.setUTCMinutes(0, 0, 0); // afronden naar heel uur
  while (cur.getTime() <= toMs) {
    const y  = cur.getUTCFullYear();
    const mo = String(cur.getUTCMonth() + 1).padStart(2, "0");
    const d  = String(cur.getUTCDate()).padStart(2, "0");
    const h  = String(cur.getUTCHours()).padStart(2, "0");
    hours.push(`${y}-${mo}-${d}T${h}:00:00+00:00`);
    cur.setUTCHours(cur.getUTCHours() + 1);
  }
  return hours;
}

/* ─── Chart data ──────────────────────────────────────────────── */
function makeChart(canvas, type, labels, values, color) {
  const isBar = type === "bar";
  return new Chart(canvas, {
    type,
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor:      isBar ? color.bar  : color.line,
        backgroundColor:  isBar ? color.bar  : color.fill,
        borderWidth:      isBar ? 0 : 2,
        borderRadius:     isBar ? 3 : 0,
        pointRadius:      isBar ? 0 : 3,
        pointHoverRadius: 4,
        fill:    !isBar,
        tension: 0.3,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 150 },
      plugins: {
        legend: { display: false },
        tooltip: { mode: "index", intersect: false },
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 10 }, maxRotation: 0, maxTicksLimit: mode === "per-uur" ? 6 : 7 },
        },
        y: {
          beginAtZero: true,
          grid: { color: "#f0f0f0" },
          ticks: { font: { size: 10 }, precision: 0 },
        },
      },
    },
  });
}

/* ─── Mini chart (sparkline) ──────────────────────────────── */
function makeMiniChart(canvas, labels, values) {
  return new Chart(canvas, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: COLORS.pageviews.line,
        backgroundColor: COLORS.pageviews.fill,
        borderWidth: 1.5,
        pointRadius: 0,
        fill: true,
        tension: 0.4,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 150 },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: { display: false },
        y: { display: false, beginAtZero: true },
      },
    },
  });
}

/* ─── Compare section ─────────────────────────────────────── */
function renderCompare() {
  const el = document.getElementById("compare");
  el.innerHTML = "";

  // Verwijder oude mini-chart instanties
  for (const id of Object.keys(miniChartRefs)) {
    if (miniChartRefs[id]) { miniChartRefs[id].destroy(); miniChartRefs[id] = null; }
  }

  const toChart = []; // na DOM-insert in één rAF renderen

  for (const group of GROUPS) {
    const col = document.createElement("div");
    col.className = "compare-group";

    const titleEl = document.createElement("div");
    titleEl.className = "compare-group-title";
    titleEl.textContent = group.title;
    col.appendChild(titleEl);

    for (const siteName of group.sites) {
      const site = siteData.find(s => s.name === siteName);
      if (!site) continue;

      const label    = displayName(siteName);
      const { labels, pvData } = getChartData(site);
      const total    = getTotals(site).pv;
      const canvasId = `mini-${site.id}`;

      const card = document.createElement("div");
      card.className = "mini-card";
      card.title     = `Ga naar ${site.name}`;
      card.innerHTML = `
        <div class="mini-card-header">
          <span class="mini-card-name">${esc(label)}</span>
          <span class="mini-card-total">${fmt(total)} pv</span>
        </div>
        <div class="mini-chart-wrap">
          ${labels.length
            ? `<canvas id="${canvasId}"></canvas>`
            : `<span style="font-size:0.7rem;color:var(--muted);font-style:italic">Geen data</span>`}
        </div>
      `;
      card.addEventListener("click", () => {
        document.getElementById(`card-${site.id}`)
          ?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      col.appendChild(card);

      if (labels.length) {
        toChart.push({ canvasId, labels, pvData, siteId: site.id });
      }
    }

    el.appendChild(col); // kolom in DOM vóór charts renderen
  }

  // Alle kolommen staan nu in de DOM; render charts in één frame
  requestAnimationFrame(() => {
    for (const { canvasId, labels, pvData, siteId } of toChart) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) continue;
      miniChartRefs[siteId] = makeMiniChart(canvas, labels, pvData);
    }
  });
}

function updateMiniCharts() {
  renderCompare();
}

/* ─── Bar table ───────────────────────────────────────────── */
function barTable(rows, labelKey, valueKey, colA, colB) {
  if (!rows || rows.length === 0) return `<p class="empty">Geen data in deze periode.</p>`;
  const max = Math.max(...rows.map(r => r[valueKey] ?? 0), 1);
  let html = `<table><thead><tr><th>${colA}</th><th>${colB}</th></tr></thead><tbody>`;
  for (const row of rows) {
    const val = row[valueKey] ?? 0;
    const pct = Math.round((val / max) * 100);
    html += `<tr>
      <td class="bar-cell">
        <div class="bar-bg" style="width:${pct}%"></div>
        <span class="bar-text">${esc(String(row[labelKey] ?? ""))}</span>
      </td>
      <td>${fmt(val)}</td>
    </tr>`;
  }
  return html + `</tbody></table>`;
}

/* ─── Render / update ─────────────────────────────────────── */
function statLabel() {
  const nl = nlOnly ? " (NL)" : "";
  if (mode === "per-uur") return [`Pageviews (gefilterd)${nl}`, `Bezoekers (gefilterd)${nl}`];
  if (mode === "totaal")  return [`Totaal pageviews${nl}`,      `Totaal bezoekers${nl}`];
  return [`Pageviews${nl}`, `Bezoekers${nl}`];
}

function fmtStat(n) { return n === null ? "—" : fmt(n); }

function renderSite(site) {
  const card = document.createElement("div");
  card.className = "site-card";
  card.id = `card-${site.id}`;

  const siteForms = formsData.filter(f => f.site_name === site.name);
  const totals = getTotals(site);
  const { type, labels, pvData, visData } = getChartData(site);
  const [pvLbl, visLbl] = statLabel();
  const hasHourly = (site.hourly ?? []).length > 0;
  const noChart   = mode === "per-uur" ? (!hasHourly || labels.length === 0) : labels.length === 0;
  const noteMsg   = mode === "per-uur" && !hasHourly
    ? "Nog geen uurdata — beschikbaar na de volgende scraper-run."
    : "Geen data in deze periode.";

  card.innerHTML = `
    <div class="site-header">
      <h2>${esc(displayName(site.name))}</h2>
    </div>
    <div class="summary-row">
      <div class="stat-box">
        <div class="stat-label" id="lbl-pv-${site.id}">${esc(pvLbl)}</div>
        <div class="stat-value" id="val-pv-${site.id}">${fmtStat(totals.pv)}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label" id="lbl-vis-${site.id}">${esc(visLbl)}</div>
        <div class="stat-value" id="val-vis-${site.id}">${fmtStat(totals.vis)}</div>
      </div>
    </div>
    <div class="charts-row">
      <div class="chart-box">
        <div class="chart-title">Pageviews</div>
        <div class="chart-wrap" id="wrap-pv-${site.id}">
          ${noChart ? `<p class="chart-note">${noteMsg}</p>` : `<canvas id="pv-${site.id}"></canvas>`}
        </div>
      </div>
      <div class="chart-box">
        <div class="chart-title">Unieke bezoekers</div>
        <div class="chart-wrap" id="wrap-vis-${site.id}">
          ${noChart ? `<p class="chart-note">${noteMsg}</p>` : `<canvas id="vis-${site.id}"></canvas>`}
        </div>
      </div>
    </div>
    <div class="tables-row">
      <div class="table-box">
        <div class="table-title">Top landen</div>
        <div id="tbl-ctry-${site.id}">${barTable(getCountries(site), "country", "pageviews", "Land", "Pageviews")}</div>
      </div>
      <div class="table-box">
        <div class="table-title">Top bronnen</div>
        <div id="tbl-src-${site.id}">${barTable(getSources(site), "source", "referrals", "Bron", "Verwijzingen")}</div>
      </div>
    </div>
    <div class="country-chart-section">
      <div class="table-title">Landen over tijd</div>
      <div class="chart-wrap chart-wrap--country" id="wrap-ctry-chart-${site.id}">
        <p class="chart-note">Nog geen landdata — beschikbaar na de volgende scraper-run.</p>
      </div>
    </div>
    ${siteForms.map(f => `
    <div class="forms-section">
      <div class="form-stat">
        <div class="stat-label">Formulier: ${esc(f.name)}</div>
        <div class="stat-value" id="form-val-${f.id}">${fmt(filteredFormTotal(f))}</div>
        <div class="sub-label">verzendingen in periode</div>
      </div>
      <div class="form-chart-box">
        <div class="chart-title" id="form-chart-title-${f.id}">${mode === "per-uur" ? "Verzendingen per uur" : "Verzendingen per dag"}</div>
        <div class="chart-wrap" id="form-wrap-${f.id}">
          ${(() => { const d = getFormChartData(f); return d.values.every(v => v === 0) ? `<p class="chart-note">Geen verzendingen in deze periode.</p>` : `<canvas id="form-chart-${f.id}"></canvas>`; })()}
        </div>
      </div>
    </div>`).join("")}
  `;

  if (!noChart) {
    requestAnimationFrame(() => {
      const c1 = card.querySelector(`#pv-${site.id}`);
      const c2 = card.querySelector(`#vis-${site.id}`);
      chartRefs[site.id] = {
        pv:  c1 ? makeChart(c1, type, labels, pvData,  COLORS.pageviews) : null,
        vis: c2 ? makeChart(c2, type, labels, visData, COLORS.visitors)  : null,
      };
    });
  } else {
    chartRefs[site.id] = { pv: null, vis: null };
  }

  // Landen-over-tijd grafiek
  requestAnimationFrame(() => {
    const wrap = card.querySelector(`#wrap-ctry-chart-${site.id}`);
    if (!wrap) return;
    const ctryData = getCountryChartData(site);
    if (!ctryData) return;
    wrap.innerHTML = `<canvas id="ctry-chart-${site.id}"></canvas>`;
    const canvas = wrap.querySelector(`#ctry-chart-${site.id}`);
    if (canvas) {
      if (countryChartRefs[site.id]) { countryChartRefs[site.id].destroy(); }
      countryChartRefs[site.id] = makeStackedChart(canvas, ctryData.labels, ctryData.datasets);
    }
  });

  // Formuliergrafieken
  requestAnimationFrame(() => {
    for (const f of siteForms) {
      const canvas = card.querySelector(`#form-chart-${f.id}`);
      if (!canvas) continue;
      const { labels, values } = getFormChartData(f);
      if (formChartRefs[f.id]) { formChartRefs[f.id].destroy(); }
      formChartRefs[f.id] = makeChart(canvas, "bar", labels, values, {
        line: "#7c3aed", fill: "rgba(124,58,237,0.10)", bar: "rgba(124,58,237,0.55)",
      });
    }
  });

  return card;
}

function updateAllCards() {
  const el = id => document.getElementById(id);

  for (const site of siteData) {
    // Summary numbers
    const totals         = getTotals(site);
    const [pvLbl, visLbl] = statLabel();
    if (el(`lbl-pv-${site.id}`))  el(`lbl-pv-${site.id}`).textContent  = pvLbl;
    if (el(`lbl-vis-${site.id}`)) el(`lbl-vis-${site.id}`).textContent = visLbl;
    if (el(`val-pv-${site.id}`))  el(`val-pv-${site.id}`).textContent  = fmtStat(totals.pv);
    if (el(`val-vis-${site.id}`)) el(`val-vis-${site.id}`).textContent = fmtStat(totals.vis);

    // Tables
    const ctryEl = el(`tbl-ctry-${site.id}`);
    const srcEl  = el(`tbl-src-${site.id}`);
    if (ctryEl) ctryEl.innerHTML = barTable(getCountries(site), "country", "pageviews", "Land", "Pageviews");
    if (srcEl)  srcEl.innerHTML  = barTable(getSources(site),   "source",  "referrals", "Bron", "Verwijzingen");

    // Landen-over-tijd grafiek
    if (countryChartRefs[site.id]) { countryChartRefs[site.id].destroy(); countryChartRefs[site.id] = null; }
    const wCtry = el(`wrap-ctry-chart-${site.id}`);
    if (wCtry) {
      const ctryData = getCountryChartData(site);
      if (ctryData) {
        wCtry.innerHTML = `<canvas id="ctry-chart-${site.id}"></canvas>`;
        const ctryCanvas = el(`ctry-chart-${site.id}`);
        if (ctryCanvas) countryChartRefs[site.id] = makeStackedChart(ctryCanvas, ctryData.labels, ctryData.datasets);
      } else {
        wCtry.innerHTML = `<p class="chart-note">Nog geen landdata — beschikbaar na de volgende scraper-run.</p>`;
      }
    }

    // Pageviews / bezoekers grafieken: destroy old, recreate
    const refs = chartRefs[site.id] ?? {};
    if (refs.pv)  { refs.pv.destroy();  refs.pv  = null; }
    if (refs.vis) { refs.vis.destroy(); refs.vis = null; }
    chartRefs[site.id] = { pv: null, vis: null };

    const hasHourly = (site.hourly ?? []).length > 0;
    const { type, labels, pvData, visData } = getChartData(site);
    const noChart = mode === "per-uur" ? (!hasHourly || labels.length === 0) : labels.length === 0;
    const noteMsg = mode === "per-uur" && !hasHourly
      ? "Nog geen uurdata — beschikbaar na de volgende scraper-run."
      : "Geen data in deze periode.";

    const wPv  = el(`wrap-pv-${site.id}`);
    const wVis = el(`wrap-vis-${site.id}`);

    if (noChart) {
      if (wPv)  wPv.innerHTML  = `<p class="chart-note">${noteMsg}</p>`;
      if (wVis) wVis.innerHTML = `<p class="chart-note">${noteMsg}</p>`;
      continue;
    }

    if (wPv)  wPv.innerHTML  = `<canvas id="pv-${site.id}"></canvas>`;
    if (wVis) wVis.innerHTML = `<canvas id="vis-${site.id}"></canvas>`;

    const c1 = el(`pv-${site.id}`);
    const c2 = el(`vis-${site.id}`);
    chartRefs[site.id] = {
      pv:  c1 ? makeChart(c1, type, labels, pvData,  COLORS.pageviews) : null,
      vis: c2 ? makeChart(c2, type, labels, visData, COLORS.visitors)  : null,
    };
  }

  // Formulieren bijwerken
  for (const f of formsData) {
    const valEl   = el(`form-val-${f.id}`);
    const wrapEl  = el(`form-wrap-${f.id}`);
    const titleEl = el(`form-chart-title-${f.id}`);
    if (valEl)   valEl.textContent   = fmt(filteredFormTotal(f));
    if (titleEl) titleEl.textContent = mode === "per-uur" ? "Verzendingen per uur" : "Verzendingen per dag";
    if (!wrapEl) continue;

    if (formChartRefs[f.id]) { formChartRefs[f.id].destroy(); formChartRefs[f.id] = null; }

    const { labels, values } = getFormChartData(f);
    if (values.every(v => v === 0)) {
      wrapEl.innerHTML = `<p class="chart-note">Geen verzendingen in deze periode.</p>`;
      continue;
    }
    wrapEl.innerHTML = `<canvas id="form-chart-${f.id}"></canvas>`;
    const canvas = el(`form-chart-${f.id}`);
    if (canvas) {
      formChartRefs[f.id] = makeChart(canvas, "bar", labels, values,
        { line: "#7c3aed", fill: "rgba(124,58,237,0.10)", bar: "rgba(124,58,237,0.55)" }
      );
    }
  }
}

/* ─── Controls wiring ─────────────────────────────────────── */
function readInputs() {
  const fv = document.getElementById("from-dt").value;
  const tv = document.getElementById("to-dt").value;
  fromDt = fv ? new Date(fv) : null;
  toDt   = tv ? new Date(tv) : null;
  updateAllCards();
}

document.getElementById("from-dt").addEventListener("change", readInputs);
document.getElementById("to-dt").addEventListener("change", readInputs);

document.getElementById("reset-filter").addEventListener("click", () => {
  document.getElementById("from-dt").value = "";
  document.getElementById("to-dt").value   = "";
  fromDt = null;
  toDt   = null;
  updateAllCards();
});

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    updateAllCards();
  });
});

document.getElementById("nl-toggle").addEventListener("click", () => {
  nlOnly = !nlOnly;
  document.getElementById("nl-toggle").classList.toggle("active", nlOnly);
  updateAllCards();
});

/* ─── Load ────────────────────────────────────────────────── */
async function load() {
  const bust = Date.now();
  const [analyticsRes, formsRes] = await Promise.all([
    fetch(`./data/analytics.json?v=${bust}`, { cache: "no-store" }),
    fetch(`./data/forms.json?v=${bust}`,     { cache: "no-store" }),
  ]);

  const main = document.getElementById("main");
  main.innerHTML = "";

  if (!analyticsRes.ok) {
    main.innerHTML = `<p style="color:red">Kon analytics.json niet laden (${analyticsRes.status}).</p>`;
    return;
  }

  const data = await analyticsRes.json();
  if (formsRes.ok) {
    const formsJson = await formsRes.json();
    formsData = formsJson.forms ?? [];
  }

  if (data.last_updated) {
    const d = new Date(data.last_updated);
    document.getElementById("updated-at").textContent =
      "Bijgewerkt: " + d.toLocaleString("nl-NL", { dateStyle: "short", timeStyle: "short" });
  }

  if (data.zero_point) {
    const d = new Date(data.zero_point);
    document.getElementById("zero-point-at").textContent =
      "Nulpunt: " + d.toLocaleString("nl-NL", { dateStyle: "short", timeStyle: "short" });

    // Stel datepicker-grenzen en standaardwaarden in
    const zpLocal = new Date(data.zero_point);
    const pad = n => String(n).padStart(2, "0");
    const localStr = dt =>
      `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;

    const minStr = localStr(zpLocal);
    const nowStr = localStr(new Date());

    const fromEl = document.getElementById("from-dt");
    const toEl   = document.getElementById("to-dt");

    fromEl.min = minStr;
    toEl.min   = minStr;
    fromEl.max = nowStr;
    toEl.max   = nowStr;

    // Standaard: van = nulpunt, tot = nu
    fromEl.value = minStr;
    toEl.value   = nowStr;
    fromDt = zpLocal;
    toDt   = new Date();
  }

  siteData = (data.sites ?? []).sort((a, b) => {
    const ai = SITE_ORDER.indexOf(a.name), bi = SITE_ORDER.indexOf(b.name);
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
  });

  if (siteData.length === 0) {
    const zp = data.zero_point
      ? new Date(data.zero_point).toLocaleString("nl-NL", { dateStyle: "short", timeStyle: "short" })
      : "onbekend";
    main.innerHTML = `<p style="color:var(--muted)">Nulpunt ingesteld op ${zp}. Wacht op de volgende scraper-run voor nieuwe data.</p>`;
    return;
  }

  // Volledige cards gegroepeerd met groepstitels
  for (const group of GROUPS) {
    const groupSites = group.sites
      .map(name => siteData.find(s => s.name === name))
      .filter(Boolean);
    if (groupSites.length === 0) continue;

    const header = document.createElement("div");
    header.className = "group-header";
    header.textContent = group.title;
    main.appendChild(header);

    const row = document.createElement("div");
    row.className = "group-cards";
    for (const site of groupSites) {
      row.appendChild(renderSite(site));
    }
    main.appendChild(row);
  }
}

load().catch(err => {
  document.getElementById("main").innerHTML = `<p style="color:red">Fout: ${err.message}</p>`;
});
</script>
</body>
</html>
