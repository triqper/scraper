# Draait elk uur tussen 8:00 en 23:00 CEST (6:00-21:00 UTC, zomer).
# In de winter (CET, UTC+1) is dit 7:00-22:00 lokale tijd — dicht genoeg.
# ~17 runs/dag × 15 seconden ≈ 130 minuten/maand (ruim binnen de 2.000 gratis minuten).

name: Netlify Analytics

on:
  schedule:
    - cron: "0 6-21 * * *"   # Elk uur van 8-23 CEST
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      - name: Scraper uitvoeren
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: python scraper.py

      - name: Data opslaan en pushen
        run: |
          git config user.name  "Analytics Bot"
          git config user.email "analytics-bot@users.noreply.github.com"
          git add data/ index.html
          git diff --staged --quiet \
            && echo "Geen nieuwe data." \
            || (
              git commit -m "chore: analytics bijwerken $(date -u +%Y-%m-%d)" \
              && git push
            )
