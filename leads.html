<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoonConnect Leads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        hsl(0 0% 97.5%);
      --surface:   hsl(0 0% 100%);
      --border:    hsl(214.3 31.8% 91.4%);
      --text:      hsl(222.2 84% 4.9%);
      --muted:     hsl(215.4 16.3% 46.9%);
      --muted-bg:  hsl(210 40% 96.1%);
      --accent:    hsl(221.2 83.2% 53.3%);
      --radius:    0.5rem;
      --radius-sm: 0.375rem;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow:    0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      background: #000000;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    header h1 { color: #fff; font-size: 1.5rem; font-weight: 600; }
    header a.back-link {
      color: #8b949e; font-size: 0.82rem;
      text-decoration: none; margin-left: auto; white-space: nowrap;
    }
    header a.back-link:hover { color: #fff; }

    /* ── Controls ── */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .ctrl-label { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
    .ctrl-group { display: flex; align-items: center; gap: 0.4rem; }

    .date-btn {
      font-size: 0.88rem; padding: 0.32rem 0.74rem; line-height: 1.4;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text);
      cursor: pointer; white-space: nowrap; font-family: inherit;
    }
    .date-btn:hover { border-color: var(--accent); }

    input[type="datetime-local"].hidden-picker {
      position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0;
    }

    .btn-reset {
      font-size: 0.88rem; padding: 0.32rem 0.74rem; line-height: 1.4;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--muted); cursor: pointer;
    }
    .btn-reset:hover { background: var(--bg); color: var(--text); }

    .filter-count { font-size: 0.78rem; color: var(--muted); margin-left: auto; }

    .btn-settings {
      font-size: 0.88rem; padding: 0.32rem 0.74rem; line-height: 1.4;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--muted); cursor: pointer;
      white-space: nowrap; font-family: inherit;
    }
    .btn-settings:hover { background: var(--bg); color: var(--text); }

    /* ── Main ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2.25rem;
    }

    /* ── Section ── */
    .section-header {
      display: flex; align-items: center; gap: 0.625rem;
      margin-bottom: 0.875rem;
    }
    .section-title {
      font-size: 0.9375rem; font-weight: 600; color: var(--text);
      letter-spacing: -0.01em;
    }
    .section-badge {
      display: inline-flex; align-items: center; justify-content: center;
      height: 1.375rem; min-width: 1.375rem; padding: 0 0.375rem;
      font-size: 0.6875rem; font-weight: 600;
      background: var(--muted-bg); color: var(--muted);
      border-radius: 9999px; border: 1px solid var(--border);
    }

    .empty-note {
      color: var(--muted); font-size: 0.8125rem;
      padding: 2.5rem 1.5rem; text-align: center;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }

    .leads-table {
      width: 100%; border-collapse: collapse; font-size: 0.8125rem;
    }

    .leads-table thead {
      background: var(--muted-bg);
      border-bottom: 1px solid var(--border);
    }
    .leads-table thead th {
      text-align: left; padding: 0.5625rem 1rem;
      font-size: 0.6875rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); white-space: nowrap;
    }
    .leads-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .leads-table tbody tr:last-child { border-bottom: none; }
    .leads-table tbody tr:hover { background: hsl(210 40% 98.5%); }
    .leads-table td {
      padding: 0.6875rem 1rem; vertical-align: middle;
    }

    .col-date    { color: var(--muted); font-size: 0.75rem; width: 8rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .col-naam    { font-weight: 500; white-space: nowrap; }
    .col-adres   { color: var(--muted); white-space: nowrap; }
    .col-contact { white-space: nowrap; min-width: 7rem; }
    .col-status  { width: 12rem; }
    .col-note    { width: 15rem; }
    .col-link    { width: 3.5rem; text-align: right; white-space: nowrap; }
    .col-empty   { color: hsl(215 20% 78%); font-size: 0.75rem; }

    /* ── Contact badge ── */
    .contact-badge {
      display: inline-flex; align-items: center; gap: 0.3125rem;
      font-size: 0.75rem; font-weight: 500; border-radius: 9999px;
      padding: 0.1875rem 0.5rem;
      border: 1px solid transparent;
    }
    .contact-badge.mail {
      color: #1d4ed8; background: #eff6ff; border-color: #bfdbfe;
    }
    .contact-badge.whatsapp {
      color: #15803d; background: #f0fdf4; border-color: #bbf7d0;
    }
    .contact-badge.phone {
      color: #7c3aed; background: #f5f3ff; border-color: #ddd6fe;
    }
    .contact-badge.default {
      color: var(--muted); background: var(--muted-bg); border-color: var(--border);
    }

    /* ── Status select ── */
    .status-wrap { display: flex; align-items: center; gap: 0.375rem; }
    .status-select {
      font-size: 0.75rem; padding: 0.28125rem 0.5rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text);
      cursor: pointer; font-family: inherit; font-weight: 500;
    }
    .status-select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .status-select[data-status="Todo"]             { background: var(--muted-bg); color: var(--muted); border-color: var(--border); }
    .status-select[data-status="Benaderd"]         { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .status-select[data-status="Ingepland"]        { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
    .status-select[data-status="Afgezegd"]         { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .status-select[data-status="Benaderd 2e keer"] { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .status-select[data-status="Benaderd 3e keer"] { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
    .status-select[data-status="Geen gehoor"]      { background: #f9fafb; color: #4b5563; border-color: #e5e7eb; }
    .status-select[data-status="Afgerond"]         { background: #f0fdf4; color: #15803d; border-color: #86efac; }

    .lead-note {
      width: 100%; font-size: 0.8125rem; font-family: inherit;
      padding: 0.28125rem 0.5rem; border: 1px solid transparent;
      border-radius: var(--radius-sm); background: transparent;
      color: var(--text); line-height: 1.4;
      resize: vertical; min-height: 1.75rem; display: block;
    }
    .lead-note:hover { border-color: var(--border); background: var(--muted-bg); }
    .lead-note:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--surface); border-color: var(--border); }
    .lead-note::placeholder { color: hsl(215 20% 72%); }

    .status-saved-note {
      font-size: 0.6875rem; color: #15803d; opacity: 0;
      transition: opacity 0.3s; white-space: nowrap; font-weight: 500;
    }
    .status-saved-note.visible { opacity: 1; }

    .tbl-link {
      display: inline-flex; align-items: center; gap: 0.2rem;
      font-size: 0.75rem; font-weight: 500; color: var(--accent);
      text-decoration: none; padding: 0.25rem 0.375rem;
      border-radius: var(--radius-sm);
      transition: background 0.12s;
    }
    .tbl-link:hover { background: #eff6ff; }

    /* ── Settings panel ── */
    .settings-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.35); z-index: 99;
      backdrop-filter: blur(2px);
    }
    .settings-backdrop.open { display: block; }

    .settings-panel {
      position: fixed; top: 0; right: -360px; bottom: 0; width: 340px;
      background: var(--surface); border-left: 1px solid var(--border);
      box-shadow: -8px 0 32px rgba(0,0,0,0.1); z-index: 100;
      transition: right 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .settings-panel.open { right: 0; }

    .settings-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
      font-weight: 600; font-size: 0.875rem; flex-shrink: 0;
    }
    .settings-close {
      background: none; border: none; cursor: pointer; color: var(--muted);
      padding: 0.3125rem; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
    }
    .settings-close:hover { background: var(--muted-bg); color: var(--text); }

    .settings-section { padding: 1.25rem; border-bottom: 1px solid var(--border); }
    .settings-section-title {
      font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--muted); margin-bottom: 0.875rem; font-weight: 600;
    }
    .settings-date-field { display: flex; align-items: center; gap: 0.5rem; padding: 0.1875rem 0; }
    .settings-date-label { font-size: 0.75rem; color: var(--muted); width: 2rem; flex-shrink: 0; font-weight: 500; }
    .settings-date-pick-btn {
      flex: 1; font-size: 0.8125rem; padding: 0.3125rem 0.5rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text); cursor: pointer;
      font-family: inherit; text-align: left; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; line-height: 1.4;
    }
    .settings-date-pick-btn:hover { border-color: var(--accent); }
    .settings-btn-sm {
      width: 100%; margin-top: 0.375rem; font-size: 0.8125rem;
      padding: 0.3125rem 0.5rem; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--surface);
      color: var(--muted); cursor: pointer; font-family: inherit; text-align: left;
      transition: background 0.12s, color 0.12s;
    }
    .settings-btn-sm:hover { background: var(--muted-bg); color: var(--text); }
    .settings-date-warning {
      font-size: 0.75rem; color: #92400e; background: #fffbeb;
      border: 1px solid #fde68a; border-radius: var(--radius-sm);
      padding: 0.375rem 0.5rem; margin: 0.375rem 0; line-height: 1.4;
    }

    /* ── Password overlay ── */
    #pw-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: hsl(222.2 84% 4.9%);
      display: flex; align-items: center; justify-content: center;
    }
    #pw-box {
      background: hsl(220 14% 7.5%);
      border: 1px solid hsl(215 20% 16%);
      border-radius: 0.75rem;
      padding: 2rem 2.25rem;
      width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 1.125rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
    }
    #pw-box h2 { color: #fff; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
    #pw-box p  { color: hsl(215 20% 52%); font-size: 0.8125rem; margin-top: -0.5rem; }
    #pw-input {
      width: 100%; padding: 0.5625rem 0.75rem; font-size: 0.9rem;
      background: hsl(220 14% 11%); border: 1px solid hsl(215 20% 21%);
      border-radius: 0.5rem; color: #fff; font-family: inherit; outline: none;
      transition: border-color 0.15s;
    }
    #pw-input:focus { border-color: hsl(221.2 83.2% 53.3%); }
    #pw-submit {
      width: 100%; padding: 0.5625rem; font-size: 0.875rem; font-weight: 600;
      background: hsl(221.2 83.2% 53.3%); color: #fff; border: none;
      border-radius: 0.5rem; cursor: pointer; font-family: inherit;
      transition: background 0.15s;
    }
    #pw-submit:hover { background: hsl(221.2 83.2% 46%); }
    #pw-error { font-size: 0.8rem; color: #f87171; text-align: center; display: none; margin-top: -0.375rem; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      main { padding: 1rem; gap: 1.5rem; }
      .controls { padding: 0.5rem 1rem; }
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .leads-table { min-width: 580px; }
      .settings-panel { width: 100%; right: -105%; }
      .settings-header { font-size: 1rem; padding: 1.125rem 1.25rem; }
      .settings-section { padding: 1.125rem 1.25rem; }
    }
  </style>
</head>
<body>

<div id="pw-overlay">
  <div id="pw-box">
    <h2>WoonConnect Leads</h2>
    <p>Voer het wachtwoord in om verder te gaan.</p>
    <input type="password" id="pw-input" placeholder="Wachtwoord" autocomplete="current-password" />
    <button id="pw-submit" type="button">Inloggen</button>
    <span id="pw-error">Onjuist wachtwoord — probeer opnieuw.</span>
  </div>
</div>

<header>
  <h1>WoonConnect Leads</h1>
  <a class="back-link" href="./index.html">← Dashboard</a>
</header>

<div class="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">Van</span>
    <button class="date-btn" id="from-btn" type="button">Datum</button>
    <input type="datetime-local" id="from-dt" class="hidden-picker" />
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Tot</span>
    <button class="date-btn" id="to-btn" type="button">Datum</button>
    <input type="datetime-local" id="to-dt" class="hidden-picker" />
  </div>
  <button class="btn-reset" id="reset-filter">Alles tonen</button>
  <span class="filter-count" id="filter-count"></span>
  <button class="btn-settings" id="settings-btn" type="button" style="margin-left:auto">⚙ Instellingen</button>
</div>

<div class="settings-backdrop" id="settings-backdrop"></div>
<div class="settings-panel" id="settings-panel">
  <div class="settings-header">
    Instellingen
    <button class="settings-close" id="settings-close" type="button" aria-label="Sluiten">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="settings-section">
    <div class="settings-section-title">Basis dataset</div>
    <div class="settings-date-field">
      <span class="settings-date-label">Van</span>
      <button class="settings-date-pick-btn" id="base-from-btn" type="button">Alles</button>
      <input type="datetime-local" id="base-from-dt" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0" />
    </div>
    <div class="settings-date-field">
      <span class="settings-date-label">Tot</span>
      <button class="settings-date-pick-btn" id="base-to-btn" type="button">Alles</button>
      <input type="datetime-local" id="base-to-dt" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0" />
    </div>
    <div class="settings-date-warning">⚠️ Alle data vóór 6 mei is testdata.</div>
    <button class="settings-btn-sm" id="base-show-real">Alleen echte data</button>
    <button class="settings-btn-sm" id="base-show-testdata">Alleen testdata tonen</button>
    <button class="settings-btn-sm" id="base-reset">Alle data tonen</button>
  </div>
</div>

<main id="main">
  <p style="color:var(--muted)">Laden…</p>
</main>

<script>
/* ── Wachtwoordbeveiliging ── */
const PASSWORD_HASH = "aba393ea2ecdbd4a1ec52f7f2a4c1b6de7698c2ba43b4d0d4fde82d8f79789ed";
const SESSION_KEY   = "leads_auth";

async function hashPassword(pw) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
}

async function tryLogin() {
  const pw   = document.getElementById("pw-input").value;
  const hash = await hashPassword(pw);
  if (hash === PASSWORD_HASH) {
    sessionStorage.setItem(SESSION_KEY, PASSWORD_HASH);
    document.getElementById("pw-overlay").style.display = "none";
    load();
  } else {
    document.getElementById("pw-error").style.display = "block";
    document.getElementById("pw-input").select();
  }
}

document.getElementById("pw-submit").addEventListener("click", tryLogin);
document.getElementById("pw-input").addEventListener("keydown", e => {
  if (e.key === "Enter") tryLogin();
});

if (sessionStorage.getItem(SESSION_KEY) === PASSWORD_HASH) {
  document.getElementById("pw-overlay").style.display = "none";
  load();
}

/* ── JSONBin configuratie ── */
const JSONBIN_KEY    = "$2a$10$CSwQD7aPZSfOOcP0oPjWoeUpva8jxT9hA3z8gd.QKkEC5r1J5Igf2";
const JSONBIN_BIN_ID = "69fa2db2aaba88219775265a";
const JSONBIN_URL    = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

const SITE_LABELS = {
  "woonstroom-interesse-landing":    "Interesse Landing",
  "woonstroom-aanbod-landing":       "Aanbod Landing",
  "woonstroom-woningwaarde-landing": "Woningwaarde Landing",
};
const SITE_ORDER = [
  "woonstroom-interesse-landing",
  "woonstroom-aanbod-landing",
  "woonstroom-woningwaarde-landing",
];
const STATUSES = [
  "Todo", "Benaderd", "Ingepland", "Afgezegd",
  "Benaderd 2e keer", "Benaderd 3e keer", "Geen gehoor", "Afgerond",
];

let allForms          = [];
let filterFrom        = null;
let filterTo          = null;
let baseFromDt        = null;
let baseToDt          = null;
let earliestDataPoint = null;
let remoteStatuses    = {};
let remoteNotes       = {};

const JSONBIN_CONFIGURED = JSONBIN_KEY !== "JOUW_API_KEY_HIER" && JSONBIN_BIN_ID !== "JOUW_BIN_ID_HIER";

/* ── Status opslag ── */
function getStatus(subId) {
  return remoteStatuses[subId]
    || localStorage.getItem(`lead_status_${subId}`)
    || "Todo";
}

async function pushToJsonBin() {
  if (!JSONBIN_CONFIGURED) return;
  try {
    await fetch(JSONBIN_URL, {
      method:  "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY },
      body:    JSON.stringify({ statuses: remoteStatuses, notes: remoteNotes }),
    });
  } catch (e) {
    console.warn("JSONBin opslaan mislukt:", e);
  }
}

async function saveStatus(subId, status) {
  localStorage.setItem(`lead_status_${subId}`, status);
  remoteStatuses[subId] = status;
  await pushToJsonBin();
}

function getNote(subId) {
  return remoteNotes[subId] || localStorage.getItem(`lead_note_${subId}`) || "";
}

async function saveNote(subId, note) {
  localStorage.setItem(`lead_note_${subId}`, note);
  remoteNotes[subId] = note;
  await pushToJsonBin();
  const el = document.getElementById(`note-saved-${subId}`);
  if (el) {
    el.classList.add("visible");
    setTimeout(() => el.classList.remove("visible"), 1800);
  }
}

async function loadRemoteStatuses() {
  if (!JSONBIN_CONFIGURED) return;
  try {
    const r = await fetch(`${JSONBIN_URL}/latest`, {
      headers: { "X-Master-Key": JSONBIN_KEY },
    });
    if (!r.ok) return;
    const data = await r.json();
    remoteStatuses = data.record?.statuses || {};
    remoteNotes    = data.record?.notes    || {};
    for (const [id, st] of Object.entries(remoteStatuses)) {
      localStorage.setItem(`lead_status_${id}`, st);
    }
    for (const [id, nt] of Object.entries(remoteNotes)) {
      localStorage.setItem(`lead_note_${id}`, nt);
    }
  } catch (e) {
    console.warn("JSONBin laden mislukt, localStorage als fallback:", e);
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k?.startsWith("lead_status_")) remoteStatuses[k.replace("lead_status_", "")] = localStorage.getItem(k);
      if (k?.startsWith("lead_note_"))   remoteNotes[k.replace("lead_note_", "")]      = localStorage.getItem(k);
    }
  }
}

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function fmtDateBtn(isoStr) {
  if (!isoStr) return null;
  const d  = new Date(isoStr);
  const wd = d.toLocaleDateString("nl-NL", { weekday: "short" }).replace(".", "");
  const mo = d.toLocaleDateString("nl-NL", { month: "long" });
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${cap(wd)} ${d.getDate()} ${cap(mo)} ${hh}:${mm}`;
}

function fmtDate(isoStr) {
  if (!isoStr) return "";
  const d = new Date(isoStr);
  return cap(d.toLocaleString("nl-NL", {
    weekday: "short", day: "numeric", month: "long",
    year: "numeric", hour: "2-digit", minute: "2-digit",
  }).replace(/\.$/, ""));
}

/* ── Filter ── */
function inRange(isoStr) {
  const t = new Date(isoStr);
  if (baseFromDt && t < baseFromDt) return false;
  if (baseToDt   && t > baseToDt)   return false;
  if (filterFrom && t < filterFrom) return false;
  if (filterTo   && t > filterTo)   return false;
  return true;
}

function fmtDateShort(isoStr) {
  if (!isoStr) return "";
  const d  = new Date(isoStr);
  const mo = d.toLocaleDateString("nl-NL", { month: "short" }).replace(".", "");
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${d.getDate()} ${cap(mo)} ${hh}:${mm}`;
}

function fieldFromData(data, ...keys) {
  if (!data || typeof data !== "object") return null;
  for (const k of keys) {
    for (const dk of Object.keys(data)) {
      if (dk.toLowerCase().replace(/[- ]/g,"") === k.toLowerCase().replace(/[- ]/g,"")) {
        const v = data[dk];
        if (v !== null && v !== undefined && String(v).trim() !== "") return String(v).trim();
      }
    }
  }
  return null;
}

function contactBadge(value) {
  if (!value) return `<span class="col-empty">—</span>`;
  const v = value.toLowerCase().trim();
  let cls  = "default";
  let icon = "";
  if (v.includes("mail") || v.includes("email") || v.includes("e-mail")) {
    cls = "mail"; icon = ICON_MAIL;
  } else if (v.includes("whatsapp")) {
    cls = "whatsapp"; icon = ICON_WHATSAPP;
  } else if (v.includes("bel") || v.includes("telefoon") || v.includes("phone") || v.includes("tel")) {
    cls = "phone"; icon = ICON_PHONE;
  }
  return `<span class="contact-badge ${cls}">${icon}${esc(value)}</span>`;
}

/* ── Render ── */
function renderRow(sub, netlifyUrl) {
  const naam     = sub.naam || fieldFromData(sub.data, "naam", "name", "voornaam") || null;
  const rawAdres = sub.adres || fieldFromData(sub.data, "adres", "address", "straat", "straatnaam") || null;
  const adres    = rawAdres && !rawAdres.endsWith("***") && rawAdres.length > 6
    ? rawAdres.slice(0, 6) + "***" : rawAdres;
  const contact  = sub.contactvoorkeur || fieldFromData(sub.data, "contactvoorkeur", "contact", "voorkeur") || null;
  const current  = getStatus(sub.id);
  const options  = STATUSES.map(s =>
    `<option value="${esc(s)}"${s === current ? " selected" : ""}>${esc(s)}</option>`
  ).join("");
  const note = getNote(sub.id);

  const cellNaam  = naam  ? esc(naam)  : `<span class="col-empty">—</span>`;
  const cellAdres = adres ? esc(adres) : `<span class="col-empty">—</span>`;

  const linkCell = netlifyUrl
    ? `<a class="tbl-link" href="${esc(netlifyUrl)}" target="_blank" rel="noopener" title="Bekijk in Netlify">
        Bekijk
        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
       </a>`
    : "";

  return `
  <tr id="lead-${esc(sub.id)}">
    <td class="col-date">${esc(fmtDateShort(sub.created_at))}</td>
    <td class="col-naam" data-label="Naam">${cellNaam}</td>
    <td class="col-adres" data-label="Adres">${cellAdres}</td>
    <td class="col-contact" data-label="Contact">${contactBadge(contact)}</td>
    <td class="col-status" data-label="Status">
      <div class="status-wrap">
        <select class="status-select" data-sub-id="${esc(sub.id)}" data-status="${esc(current)}">${options}</select>
        <span class="status-saved-note" id="saved-${esc(sub.id)}">✓</span>
      </div>
    </td>
    <td class="col-note" data-label="Notitie">
      <textarea class="lead-note" data-sub-id="${esc(sub.id)}" placeholder="Notitie…" rows="1">${esc(note)}</textarea>
      <span class="status-saved-note" id="note-saved-${esc(sub.id)}">✓</span>
    </td>
    <td class="col-link">${linkCell}</td>
  </tr>`;
}

function resizeSelect(sel) {
  const tmp = document.createElement("span");
  tmp.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font-size:0.75rem;font-weight:500;font-family:inherit;padding:0 0.5rem";
  tmp.textContent = sel.options[sel.selectedIndex]?.text || sel.value;
  document.body.appendChild(tmp);
  sel.style.width = (tmp.offsetWidth + 22) + "px";
  document.body.removeChild(tmp);
}

function renderAll() {
  const main = document.getElementById("main");
  const bySite = {};
  for (const f of allForms) {
    if (!bySite[f.site_name]) bySite[f.site_name] = [];
    bySite[f.site_name].push(f);
  }

  let total = 0;
  const html = SITE_ORDER.map(sn => {
    const label = SITE_LABELS[sn] || sn;
    const siteForms = bySite[sn] || [];
    const subs = siteForms
      .flatMap(f => {
        const url = f.netlify_url || `https://app.netlify.com/sites/${f.site_name}/forms/${f.id}`;
        return (f.submissions || []).map(s => ({ ...s, _netlifyUrl: url }));
      })
      .filter(s => inRange(s.created_at))
      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    total += subs.length;
    const count = subs.length;
    const body = count
      ? `<div class="card"><div class="table-wrap"><table class="leads-table">
          <thead><tr>
            <th>Datum</th><th>Naam</th><th>Adres</th>
            <th>Contact</th><th>Status</th><th>Notitie</th><th></th>
          </tr></thead>
          <tbody>${subs.map(s => renderRow(s, s._netlifyUrl)).join("")}</tbody>
         </table></div></div>`
      : `<p class="empty-note">Geen inzendingen in deze periode.</p>`;
    return `
    <section>
      <div class="section-header">
        <span class="section-title">${esc(label)}</span>
        <span class="section-badge">${count}</span>
      </div>
      ${body}
    </section>`;
  }).join("");

  main.innerHTML = html;

  const allSubs = allForms.flatMap(f => f.submissions || []);
  const countEl = document.getElementById("filter-count");
  if (filterFrom || filterTo) {
    countEl.textContent = `${total} van ${allSubs.length} inzendingen`;
  } else {
    countEl.textContent = `${total} inzending${total !== 1 ? "en" : ""}`;
  }

  document.querySelectorAll(".lead-note").forEach(inp => {
    inp.addEventListener("blur", () => saveNote(inp.dataset.subId, inp.value));
  });

  document.querySelectorAll(".status-select").forEach(sel => {
    resizeSelect(sel);
    sel.addEventListener("change", async () => {
      const subId  = sel.dataset.subId;
      const status = sel.value;
      sel.dataset.status = status;
      resizeSelect(sel);
      const note = document.getElementById(`saved-${subId}`);
      if (note) note.textContent = "Opslaan…";
      await saveStatus(subId, status);
      if (note) {
        note.textContent = JSONBIN_CONFIGURED ? "Opgeslagen" : "Lokaal opgeslagen";
        note.classList.add("visible");
        setTimeout(() => note.classList.remove("visible"), 1800);
      }
    });
  });
}

/* ── Settings panel ── */
function openSettings()  {
  document.getElementById("settings-panel").classList.add("open");
  document.getElementById("settings-backdrop").classList.add("open");
}
function closeSettings() {
  document.getElementById("settings-panel").classList.remove("open");
  document.getElementById("settings-backdrop").classList.remove("open");
}
document.getElementById("settings-btn").addEventListener("click", openSettings);
document.getElementById("settings-close").addEventListener("click", closeSettings);
document.getElementById("settings-backdrop").addEventListener("click", closeSettings);

function updateBasePickBtns() {
  const fv = document.getElementById("base-from-dt").value;
  const tv = document.getElementById("base-to-dt").value;
  document.getElementById("base-from-btn").textContent = fmtDateBtn(fv) ?? "Alles";
  document.getElementById("base-to-btn").textContent   = fmtDateBtn(tv) ?? "Alles";
}

document.getElementById("base-from-btn").addEventListener("click", () => {
  const inp = document.getElementById("base-from-dt");
  inp.style.pointerEvents = "auto";
  inp.showPicker?.();
  inp.style.pointerEvents = "";
});
document.getElementById("base-to-btn").addEventListener("click", () => {
  const inp = document.getElementById("base-to-dt");
  inp.style.pointerEvents = "auto";
  inp.showPicker?.();
  inp.style.pointerEvents = "";
});
document.getElementById("base-from-dt").addEventListener("change", () => {
  const fv = document.getElementById("base-from-dt").value;
  baseFromDt = fv ? new Date(fv) : null;
  updateBasePickBtns();
  renderAll();
});
document.getElementById("base-to-dt").addEventListener("change", () => {
  const tv = document.getElementById("base-to-dt").value;
  baseToDt = tv ? new Date(tv) : null;
  updateBasePickBtns();
  renderAll();
});

document.getElementById("base-show-real").addEventListener("click", () => {
  const fromStr = "2026-05-06T09:00";
  document.getElementById("base-from-dt").value = fromStr;
  document.getElementById("base-to-dt").value   = "";
  baseFromDt = new Date(fromStr);
  baseToDt   = null;
  updateBasePickBtns();
  renderAll();
});

document.getElementById("base-show-testdata").addEventListener("click", () => {
  const toStr     = "2026-05-05T23:59";
  const fromDtVal = earliestDataPoint ?? new Date("2026-05-04T20:00");
  const pad       = n => String(n).padStart(2, "0");
  const fromStr   = `${fromDtVal.getFullYear()}-${pad(fromDtVal.getMonth()+1)}-${pad(fromDtVal.getDate())}T${pad(fromDtVal.getHours())}:${pad(fromDtVal.getMinutes())}`;
  document.getElementById("base-from-dt").value = fromStr;
  document.getElementById("base-to-dt").value   = toStr;
  baseFromDt = fromDtVal;
  baseToDt   = new Date(toStr);
  updateBasePickBtns();
  renderAll();
});

document.getElementById("base-reset").addEventListener("click", () => {
  document.getElementById("base-from-dt").value = "";
  document.getElementById("base-to-dt").value   = "";
  baseFromDt = null;
  baseToDt   = null;
  updateBasePickBtns();
  renderAll();
});

/* ── Date filter controls ── */
function updateDateBtns() {
  const fv = document.getElementById("from-dt").value;
  const tv = document.getElementById("to-dt").value;
  document.getElementById("from-btn").textContent = fmtDateBtn(fv) ?? "Datum";
  document.getElementById("to-btn").textContent   = fmtDateBtn(tv) ?? "Datum";
}

function applyFilter() {
  const fv = document.getElementById("from-dt").value;
  const tv = document.getElementById("to-dt").value;
  filterFrom = fv ? new Date(fv) : null;
  filterTo   = tv ? new Date(tv) : null;
  renderAll();
}

document.getElementById("from-btn").addEventListener("click", () => {
  const inp = document.getElementById("from-dt");
  inp.style.pointerEvents = "auto";
  inp.showPicker?.();
  inp.style.pointerEvents = "";
});
document.getElementById("to-btn").addEventListener("click", () => {
  const inp = document.getElementById("to-dt");
  inp.style.pointerEvents = "auto";
  inp.showPicker?.();
  inp.style.pointerEvents = "";
});
document.getElementById("from-dt").addEventListener("change", () => { updateDateBtns(); applyFilter(); });
document.getElementById("to-dt").addEventListener("change",   () => { updateDateBtns(); applyFilter(); });
document.getElementById("reset-filter").addEventListener("click", () => {
  document.getElementById("from-dt").value = "";
  document.getElementById("to-dt").value   = "";
  updateDateBtns();
  filterFrom = null;
  filterTo   = null;
  renderAll();
});

/* ── Load data ── */
async function load() {
  const main = document.getElementById("main");

  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k?.startsWith("lead_status_")) remoteStatuses[k.replace("lead_status_", "")] = localStorage.getItem(k);
    if (k?.startsWith("lead_note_"))   remoteNotes[k.replace("lead_note_", "")]      = localStorage.getItem(k);
  }

  const leadsResult = await fetch(`./data/wc-data.json?v=${Date.now()}`, { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject(`HTTP ${r.status}`))
    .catch(e => ({ error: String(e) }));

  if (leadsResult.error) {
    main.innerHTML = `<p style="color:var(--muted)">Kon wc-data.json niet laden: ${esc(leadsResult.error)}</p>`;
    return;
  }

  allForms = leadsResult.forms || [];

  const allDates = allForms
    .flatMap(f => (f.submissions || []).map(s => new Date(s.created_at)))
    .filter(d => !isNaN(d));
  earliestDataPoint = allDates.length ? new Date(Math.min(...allDates)) : null;

  const baseDefaultStr = "2026-05-06T09:00";
  document.getElementById("base-from-dt").value = baseDefaultStr;
  baseFromDt = new Date(baseDefaultStr);
  updateBasePickBtns();

  renderAll();

  if (!JSONBIN_CONFIGURED) {
    const warn = document.createElement("div");
    warn.style.cssText = "background:#fffbeb;border:1px solid #fde68a;border-radius:0.5rem;padding:0.625rem 1rem;font-size:0.8125rem;color:#92400e;margin-bottom:-1.25rem";
    warn.innerHTML = `<strong>Let op:</strong> JSONBin is nog niet geconfigureerd. Statuswijzigingen worden alleen lokaal opgeslagen.`;
    main.prepend(warn);
    return;
  }

  await loadRemoteStatuses();
  document.querySelectorAll(".status-select").forEach(sel => {
    const newStatus = getStatus(sel.dataset.subId);
    if (sel.value !== newStatus) {
      sel.value = newStatus;
      sel.dataset.status = newStatus;
      resizeSelect(sel);
    }
  });
  document.querySelectorAll(".lead-note").forEach(ta => {
    const newNote = getNote(ta.dataset.subId);
    if (ta.value !== newNote && document.activeElement !== ta) {
      ta.value = newNote;
    }
  });
}
