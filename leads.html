<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoonConnect Leads</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f6f8fa;
      --surface: #ffffff;
      --border:  #d0d7de;
      --text:    #1f2328;
      --muted:   #656d76;
      --accent:  #0969da;
      --radius:  6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      background: #000000;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    header h1 { color: #fff; font-size: 1.5rem; font-weight: 600; }
    header a.back-link {
      color: #8b949e;
      font-size: 0.82rem;
      text-decoration: none;
      margin-left: auto;
      white-space: nowrap;
    }
    header a.back-link:hover { color: #fff; }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .group-header {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      padding: 0.25rem 0 0.1rem;
      border-bottom: 2px solid var(--border);
      margin-bottom: 0.75rem;
    }

    .leads-section { display: flex; flex-direction: column; gap: 0; }

    .empty-note {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 0.75rem 0;
    }

    .lead-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: 0.6rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem 1rem;
      align-items: start;
    }

    .lead-fields { display: grid; grid-template-columns: auto 1fr; gap: 0.2rem 0.75rem; align-items: baseline; }
    .lead-field-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      white-space: nowrap;
    }
    .lead-field-value { font-size: 0.88rem; color: var(--text); word-break: break-word; }
    .lead-field-value.empty { color: var(--muted); font-style: italic; }

    .lead-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
      grid-column: 1 / -1;
    }

    .lead-status-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; min-width: 9rem; }

    .status-select {
      font-size: 0.82rem;
      padding: 0.28rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      width: 100%;
    }
    .status-select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* Status colour coding */
    .status-select[data-status="Todo"]               { background: #f6f8fa; color: #656d76; }
    .status-select[data-status="Benaderd"]           { background: #ddf4ff; color: #0969da; border-color: #54aeff; }
    .status-select[data-status="Ingepland"]          { background: #dafbe1; color: #1a7f37; border-color: #4ac26b; }
    .status-select[data-status="Afgezegd"]           { background: #ffebe9; color: #cf222e; border-color: #ff8182; }
    .status-select[data-status="Benaderd 2e keer"]   { background: #fff3cd; color: #9a6700; border-color: #d4a72c; }
    .status-select[data-status="Benaderd 3e keer"]   { background: #ffe8b4; color: #7d4e00; border-color: #c07000; }
    .status-select[data-status="Geen gehoor"]        { background: #f0f0f0; color: #555; border-color: #aaa; }

    .status-saved-note {
      font-size: 0.72rem;
      color: #1a7f37;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .status-saved-note.visible { opacity: 1; }

    .loading { color: var(--muted); padding: 2rem 0; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.15rem; }
      .lead-card { grid-template-columns: 1fr; }
      .lead-status-wrap { align-items: stretch; }
    }
  </style>
</head>
<body>

<header>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
  </svg>
  <h1>WoonConnect Leads</h1>
  <a class="back-link" href="./index.html">← Dashboard</a>
</header>

<main id="main">
  <p class="loading">Laden…</p>
</main>

<script>
const SITE_LABELS = {
  "woonstroom-interesse-landing":   "Interesse Landing",
  "woonstroom-aanbod-landing":      "Aanbod Landing",
  "woonstroom-woningwaarde-landing":"Woningwaarde Landing",
};

const SITE_ORDER = [
  "woonstroom-interesse-landing",
  "woonstroom-aanbod-landing",
  "woonstroom-woningwaarde-landing",
];

const STATUSES = [
  "Todo",
  "Benaderd",
  "Ingepland",
  "Afgezegd",
  "Benaderd 2e keer",
  "Benaderd 3e keer",
  "Geen gehoor",
];

function statusKey(subId) { return `lead_status_${subId}`; }

function getStatus(subId) {
  return localStorage.getItem(statusKey(subId)) || "Todo";
}

function saveStatus(subId, status) {
  localStorage.setItem(statusKey(subId), status);
}

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function fmtDate(isoStr) {
  if (!isoStr) return "";
  const d = new Date(isoStr);
  return d.toLocaleString("nl-NL", {
    weekday: "short", day: "numeric", month: "long",
    year: "numeric", hour: "2-digit", minute: "2-digit"
  }).replace(/\.$/, "");
}

function field(data, ...keys) {
  for (const k of keys) {
    for (const dk of Object.keys(data)) {
      if (dk.toLowerCase().replace(/[- ]/g,"") === k.toLowerCase().replace(/[- ]/g,"")) {
        const v = data[dk];
        if (v !== null && v !== undefined && String(v).trim() !== "") return String(v).trim();
      }
    }
  }
  return null;
}

function renderField(label, value) {
  if (value) {
    return `<span class="lead-field-label">${esc(label)}</span><span class="lead-field-value">${esc(value)}</span>`;
  }
  return `<span class="lead-field-label">${esc(label)}</span><span class="lead-field-value empty">—</span>`;
}

function buildStatusSelect(subId) {
  const current = getStatus(subId);
  const options = STATUSES.map(s =>
    `<option value="${esc(s)}"${s === current ? " selected" : ""}>${esc(s)}</option>`
  ).join("");
  return `<select class="status-select" data-sub-id="${esc(subId)}" data-status="${esc(current)}">${options}</select>
          <span class="status-saved-note" id="saved-${esc(subId)}">Opgeslagen</span>`;
}

function renderSubmission(sub) {
  const d    = sub.data || {};
  const naam = field(d, "naam", "name", "voornaam");
  const adres = field(d, "adres", "address", "straat");
  const contact = field(d, "contactvoorkeur", "contact", "voorkeur", "contactmethode");
  const email = field(d, "email", "emailadres", "e-mail", "mail");
  const telefoon = field(d, "telefoon", "telefoonnummer", "phone", "tel");

  return `
  <div class="lead-card" id="lead-${esc(sub.id)}">
    <div>
      <div class="lead-meta">#${sub.number || "?"} &nbsp;·&nbsp; ${esc(fmtDate(sub.created_at))}</div>
      <div class="lead-fields">
        ${renderField("Naam", naam)}
        ${renderField("Adres", adres)}
        ${renderField("Contactvoorkeur", contact)}
        ${renderField("E-mail", email)}
        ${renderField("Telefoon", telefoon)}
      </div>
    </div>
    <div class="lead-status-wrap">
      ${buildStatusSelect(sub.id)}
    </div>
  </div>`;
}

function renderSection(siteName, forms) {
  const label = SITE_LABELS[siteName] || siteName;
  const subs = forms
    .flatMap(f => f.submissions || [])
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  const body = subs.length
    ? subs.map(renderSubmission).join("")
    : `<p class="empty-note">Geen inzendingen.</p>`;

  return `
  <section>
    <div class="group-header">${esc(label)}</div>
    <div class="leads-section">${body}</div>
  </section>`;
}

async function load() {
  const main = document.getElementById("main");
  const bust = Date.now();
  let data;
  try {
    const r = await fetch(`./data/leads.json?v=${bust}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
  } catch (e) {
    main.innerHTML = `<p style="color:var(--muted)">Kon leads.json niet laden: ${esc(String(e))}</p>`;
    return;
  }

  const forms = data.forms || [];

  // Group forms by site_name
  const bySite = {};
  for (const f of forms) {
    const sn = f.site_name;
    if (!bySite[sn]) bySite[sn] = [];
    bySite[sn].push(f);
  }

  const html = SITE_ORDER
    .filter(sn => bySite[sn] || true)
    .map(sn => renderSection(sn, bySite[sn] || []))
    .join("");

  if (data.last_updated) {
    const d = new Date(data.last_updated);
    const updated = d.toLocaleString("nl-NL", {
      weekday: "long", day: "numeric", month: "long",
      year: "numeric", hour: "2-digit", minute: "2-digit"
    });
    main.innerHTML = `<p style="font-size:0.78rem;color:var(--muted);margin-bottom:-1rem">Laatst bijgewerkt: ${esc(updated)}</p>${html}`;
  } else {
    main.innerHTML = html;
  }

  // Wire up status selects
  document.querySelectorAll(".status-select").forEach(sel => {
    sel.addEventListener("change", () => {
      const subId  = sel.dataset.subId;
      const status = sel.value;
      saveStatus(subId, status);
      sel.dataset.status = status;
      const note = document.getElementById(`saved-${subId}`);
      if (note) {
        note.classList.add("visible");
        setTimeout(() => note.classList.remove("visible"), 1500);
      }
    });
  });
}

load();
</script>
</body>
</html>
